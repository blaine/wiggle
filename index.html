<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Biological Pixel Art</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background:#080808; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:'Courier New',monospace; color:#d0d0d0; user-select:none; }
#canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; border:1px solid #1a1a1a; }
#info { margin-top:18px; text-align:center; width:600px; }
#title { font-size:12px; letter-spacing:5px; text-transform:uppercase; color:#e8e8e8; }
#subtitle { font-size:9px; margin-top:5px; opacity:.35; letter-spacing:2px; text-transform:uppercase; }
#nav { display:flex; align-items:center; justify-content:center; margin-top:14px; gap:7px; flex-wrap:wrap; }
.dot { width:5px; height:5px; border-radius:50%; background:#222; cursor:pointer; transition:background .3s; }
.dot.active { background:#bbb; } .dot:hover { background:#666; }
#bar-wrap { margin-top:10px; width:100%; height:1px; background:#141414; overflow:hidden; }
#bar { height:100%; background:#444; width:0%; }
#key-hint { margin-top:8px; font-size:8px; letter-spacing:2px; opacity:.15; text-transform:uppercase; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info">
  <div id="title"></div>
  <div id="subtitle"></div>
  <div id="nav"></div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div id="key-hint">← → to navigate &nbsp;·&nbsp; space to pause</div>
</div>
<script>
'use strict';
const PIXEL=3,GW=200,GH=200;
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
canvas.width=GW*PIXEL; canvas.height=GH*PIXEL;
const imgData=ctx.createImageData(GW*PIXEL,GH*PIXEL);
const imgArr=imgData.data;
const pixels=new Uint8Array(GW*GH);
function flush(){
  const pw=GW*PIXEL;
  for(let gy=0;gy<GH;gy++){const row=gy*PIXEL;
    for(let gx=0;gx<GW;gx++){const v=pixels[gy*GW+gx],col=gx*PIXEL;
      for(let py=0;py<PIXEL;py++)for(let px=0;px<PIXEL;px++){
        const i=((row+py)*pw+(col+px))<<2;
        imgArr[i]=imgArr[i+1]=imgArr[i+2]=v;imgArr[i+3]=255;}}}
  ctx.putImageData(imgData,0,0);
}

// ── SIMS ──────────────────────────────────────────────────────────

class Conway{
  constructor(){this.a=new Uint8Array(GW*GH);this.b=new Uint8Array(GW*GH);this.age=0;this.reset();}
  reset(){for(let i=0;i<this.a.length;i++)this.a[i]=Math.random()<.31?1:0;this.age=0;}
  step(){const{a,b}=this;
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0;
        const n=a[ym*GW+xm]+a[ym*GW+x]+a[ym*GW+xp]+a[y*GW+xm]+a[y*GW+xp]+a[yp*GW+xm]+a[yp*GW+x]+a[yp*GW+xp];
        b[y*GW+x]=a[y*GW+x]?(n===2||n===3?1:0):(n===3?1:0);}}
    const t=this.a;this.a=this.b;this.b=t;
    if(++this.age>700)this.reset();}
  render(){for(let i=0;i<this.a.length;i++)pixels[i]=this.a[i]?255:0;}
}

class GrayScott{
  constructor(){this.U=new Float32Array(GW*GH);this.V=new Float32Array(GW*GH);this.Un=new Float32Array(GW*GH);this.Vn=new Float32Array(GW*GH);this.reset();}
  reset(){
    const sets=[{F:.035,k:.065},{F:.060,k:.062},{F:.040,k:.060},{F:.025,k:.060}];
    const p=sets[Math.floor(Math.random()*sets.length)];
    this.F=p.F;this.k=p.k;this.Du=.210;this.Dv=.105;
    this.U.fill(1);this.V.fill(0);
    for(let s=0;s<12;s++){
      const cx=4+Math.floor(Math.random()*(GW-8)),cy=4+Math.floor(Math.random()*(GH-8)),r=5;
      for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
        if(dx*dx+dy*dy>r*r)continue;
        const x=(cx+dx+GW)%GW,y=(cy+dy+GH)%GH;
        this.U[y*GW+x]=.5+(Math.random()-.5)*.1;this.V[y*GW+x]=.25+(Math.random()-.5)*.1;}}}
  step(){
    const{U,V,Un,Vn,F,k,Du,Dv}=this;
    for(let s=0;s<7;s++){
      for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
        for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
          const u=U[i],v=V[i];
          const lu=U[ym*GW+x]+U[yp*GW+x]+U[y*GW+xm]+U[y*GW+xp]-4*u;
          const lv=V[ym*GW+x]+V[yp*GW+x]+V[y*GW+xm]+V[y*GW+xp]-4*v;
          const uvv=u*v*v;
          Un[i]=u+Du*lu-uvv+F*(1-u);Vn[i]=v+Dv*lv+uvv-(F+k)*v;}}
      let t=this.U;this.U=this.Un;this.Un=t;t=this.V;this.V=this.Vn;this.Vn=t;}}
  render(){const{V}=this;for(let i=0;i<V.length;i++)pixels[i]=Math.floor((1-Math.max(0,Math.min(1,V[i]*5)))*255);}
}

class SlimeMold{
  constructor(){this.trail=new Float32Array(GW*GH);this.tmp=new Float32Array(GW*GH);this.reset();}
  reset(){this.trail.fill(0);const N=7000,ag=[];
    for(let i=0;i<N;i++)ag.push({x:Math.random()*GW,y:Math.random()*GH,d:Math.random()*Math.PI*2});
    this.agents=ag;}
  _sense(x,y,dir,angle){const D=9,sx=x+Math.cos(dir+angle)*D,sy=y+Math.sin(dir+angle)*D;
    return this.trail[((Math.floor(sy)%GH+GH)%GH)*GW+((Math.floor(sx)%GW+GW)%GW)];}
  step(){const{agents,trail,tmp}=this;
    for(const a of agents){
      const fl=this._sense(a.x,a.y,a.d,-.40),fc=this._sense(a.x,a.y,a.d,0),fr=this._sense(a.x,a.y,a.d,.40);
      if(fc>=fl&&fc>=fr){}else if(fl>fr)a.d-=.40*(0.5+Math.random()*.5);else a.d+=.40*(0.5+Math.random()*.5);
      a.x=((a.x+Math.cos(a.d)*1.3)%GW+GW)%GW;a.y=((a.y+Math.sin(a.d)*1.3)%GH+GH)%GH;
      trail[(Math.floor(a.y))*GW+Math.floor(a.x)]=Math.min(255,trail[Math.floor(a.y)*GW+Math.floor(a.x)]+7);}
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
        tmp[i]=(trail[i]+trail[y*GW+xm]+trail[y*GW+xp]+trail[ym*GW+x]+trail[yp*GW+x])*.2*.93;}}
    const t=this.trail;this.trail=this.tmp;this.tmp=t;}
  render(){for(let i=0;i<this.trail.length;i++)pixels[i]=Math.floor(Math.min(1,this.trail[i]/60)*255);}
}

class CyclicCA{
  constructor(){this.a=new Uint8Array(GW*GH);this.b=new Uint8Array(GW*GH);this.N=5;this.reset();}
  reset(){for(let i=0;i<this.a.length;i++)this.a[i]=Math.floor(Math.random()*this.N);}
  step(){const{a,b,N}=this;
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
        const prey=(a[i]+1)%N;
        b[i]=(a[ym*GW+x]===prey||a[yp*GW+x]===prey||a[y*GW+xm]===prey||a[y*GW+xp]===prey)?prey:a[i];}}
    const t=this.a;this.a=this.b;this.b=t;}
  render(){const{a,N}=this;for(let i=0;i<a.length;i++)pixels[i]=Math.floor(a[i]/(N-1)*255);}
}

class DLA{
  constructor(){this.grid=new Uint8Array(GW*GH);this.walkers=[];this.reset();}
  reset(){this.grid.fill(0);this.walkers=[];
    for(const[x,y]of[[GW>>1,GH>>1],[GW>>2,GH>>2],[GW*3>>2,GH>>2],[GW>>2,GH*3>>2],[GW*3>>2,GH*3>>2]])
      this.grid[y*GW+x]=1;
    this.stuck=5;for(let i=0;i<1000;i++)this._spawn();}
  _spawn(){this.walkers.push({x:Math.floor(Math.random()*GW),y:Math.floor(Math.random()*GH)});}
  step(){const{grid,walkers}=this,DIRS=[[0,1],[0,-1],[1,0],[-1,0]];
    for(let s=0;s<4;s++){
      for(let wi=walkers.length-1;wi>=0;wi--){const p=walkers[wi],d=DIRS[Math.random()*4|0];
        p.x=((p.x+d[0])+GW)%GW;p.y=((p.y+d[1])+GH)%GH;
        if(grid[p.y*GW+p.x])continue;
        let adj=false;
        for(const[dx,dy]of DIRS){const ax=(p.x+dx+GW)%GW,ay=(p.y+dy+GH)%GH;if(grid[ay*GW+ax]){adj=true;break;}}
        if(adj){grid[p.y*GW+p.x]=1;this.stuck++;walkers.splice(wi,1);this._spawn();
          if(this.stuck>GW*GH*.30)this.reset();}}}}
  render(){for(let i=0;i<this.grid.length;i++)pixels[i]=this.grid[i]?255:0;}
}

class Mitosis{
  constructor(){this.cells=[];this.reset();}
  reset(){this.cells=[];
    for(let i=0;i<4;i++)this.cells.push({x:GW*(.2+Math.random()*.6),y:GH*(.2+Math.random()*.6),r:4+Math.random()*4});}
  step(){const{cells}=this;
    for(const c of cells){c.r+=.06;
      if(c.r>16&&cells.length<160&&Math.random()<.018){
        const angle=Math.random()*Math.PI*2,off=c.r*.55,nr=c.r*.58;
        cells.push({x:c.x+Math.cos(angle)*off,y:c.y+Math.sin(angle)*off,r:nr});
        c.x-=Math.cos(angle)*off*.5;c.y-=Math.sin(angle)*off*.5;c.r=nr;}}
    for(let i=0;i<cells.length;i++)for(let j=i+1;j<cells.length;j++){
      const a=cells[i],b=cells[j],dx=b.x-a.x,dy=b.y-a.y;
      const dist=Math.sqrt(dx*dx+dy*dy)||.001,min=a.r+b.r;
      if(dist<min){const push=(min-dist)/min*.35,fx=dx/dist*push,fy=dy/dist*push;
        a.x-=fx;a.y-=fy;b.x+=fx;b.y+=fy;}}
    for(const c of cells){c.x=Math.max(c.r,Math.min(GW-c.r,c.x));c.y=Math.max(c.r,Math.min(GH-c.r,c.y));}
    if(cells.length>=160&&Math.random()<.004)this.reset();}
  render(){const{cells}=this;
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
      let d1=1e9,d2=1e9;
      for(const c of cells){const dx=x-c.x,dy=y-c.y,d=dx*dx+dy*dy;if(d<d1){d2=d1;d1=d;}else if(d<d2)d2=d;}
      pixels[y*GW+x]=(Math.sqrt(d2)-Math.sqrt(d1))<1.8?0:215;}}
}

class RawMilkBiome{
  constructor(){this.N=8;this.a=new Uint8Array(GW*GH);this.b=new Uint8Array(GW*GH);this.reset();}
  reset(){const{N,a}=this;
    const centers=Array.from({length:24},()=>({x:Math.random()*GW,y:Math.random()*GH,s:Math.floor(Math.random()*N)}));
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
      let minD=Infinity,best=0;
      for(const c of centers){const d=(x-c.x)**2+(y-c.y)**2;if(d<minD){minD=d;best=c.s;}}
      a[y*GW+x]=Math.random()<.15?Math.floor(Math.random()*N):best;}}
  step(){const{a,b,N}=this;
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
        const prey=(a[i]+1)%N;
        const eaten=a[ym*GW+xm]===prey||a[ym*GW+x]===prey||a[ym*GW+xp]===prey||
                    a[y*GW+xm]===prey||a[y*GW+xp]===prey||
                    a[yp*GW+xm]===prey||a[yp*GW+x]===prey||a[yp*GW+xp]===prey;
        b[i]=eaten?prey:a[i];}}
    const t=this.a;this.a=this.b;this.b=t;}
  render(){const{a,N}=this;for(let i=0;i<a.length;i++)pixels[i]=Math.floor(a[i]/(N-1)*255);}
}

class Terroir{
  constructor(){this.N=6;this.a=new Uint8Array(GW*GH);this.b=new Uint8Array(GW*GH);
    this.zone=new Uint8Array(GW*GH);this.reset();}
  reset(){const{N,a,zone}=this;
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
      const v=(Math.sin(x*.05+1.3)*Math.cos(y*.04+2.1)*.5+.5+Math.sin(x*.02+y*.03)*.3+.5)/2.3;
      zone[y*GW+x]=Math.floor(v*N)%N;}
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)
      a[y*GW+x]=Math.random()<.7?zone[y*GW+x]:Math.floor(Math.random()*N);}
  step(){const{a,b,N,zone}=this;
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
        const prey=(a[i]+1)%N;
        const eaten=a[ym*GW+x]===prey||a[yp*GW+x]===prey||a[y*GW+xm]===prey||a[y*GW+xp]===prey;
        b[i]=Math.random()<.0015?zone[i]:(eaten?prey:a[i]);}}
    const t=this.a;this.a=this.b;this.b=t;}
  render(){const{a,N}=this;for(let i=0;i<a.length;i++)pixels[i]=Math.floor(a[i]/(N-1)*255);}
}

class NichePreemption{
  constructor(){this.a=new Uint8Array(GW*GH);this.b=new Uint8Array(GW*GH);this.reset();}
  reset(){this.a.fill(0);
    for(let i=0;i<200;i++)this.a[Math.floor(Math.random()*GH)*GW+Math.floor(Math.random()*GW)]=1;
    for(let i=0;i<20;i++)this.a[Math.floor(Math.random()*GH)*GW+Math.floor(Math.random()*GW)]=2;}
  step(){const{a,b}=this;
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
        const nb=[a[ym*GW+x],a[yp*GW+x],a[y*GW+xm],a[y*GW+xp]];
        const nB=nb.filter(n=>n===1).length,nP=nb.filter(n=>n===2).length;
        if(a[i]===0){b[i]=nB>=1&&Math.random()<.4?1:nP>=2&&Math.random()<.2?2:0;}
        else if(a[i]===1){b[i]=Math.random()<.002?0:1;}
        else{b[i]=nB>=3?0:2;}}}
    const t=this.a;this.a=this.b;this.b=t;}
  render(){for(let i=0;i<this.a.length;i++)pixels[i]=this.a[i]===0?0:this.a[i]===1?200:70;}
}

class Pasteurization{
  constructor(){this.N=8;this.a=new Uint8Array(GW*GH);this.b=new Uint8Array(GW*GH);this.phase=0;this.timer=0;this.heatY=0;this.reset();}
  reset(){for(let i=0;i<this.a.length;i++)this.a[i]=Math.floor(Math.random()*this.N);this.phase=0;this.timer=0;this.heatY=0;}
  step(){const{a,b,N}=this;this.timer++;
    if(this.phase===0&&this.timer>300){this.phase=1;this.heatY=0;}
    if(this.phase===1){
      for(let dy=0;dy<3;dy++){const row=this.heatY+dy;if(row>=GH)continue;
        for(let x=0;x<GW;x++)if(a[row*GW+x]>1)a[row*GW+x]=0;}
      this.heatY+=3;if(this.heatY>=GH){this.phase=2;this.timer=0;}}
    if(this.phase===2&&this.timer>400)this.reset();
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
        const prey=(a[i]+1)%N;
        b[i]=(a[ym*GW+x]===prey||a[yp*GW+x]===prey||a[y*GW+xm]===prey||a[y*GW+xp]===prey)?prey:a[i];}}
    const t=this.a;this.a=this.b;this.b=t;}
  render(){const{a,N}=this;for(let i=0;i<a.length;i++)pixels[i]=Math.floor(a[i]/(N-1)*255);
    if(this.phase===1)for(let x=0;x<GW;x++)pixels[this.heatY*GW+x]=255;}
}

class EcologicalSuccession{
  constructor(){this.a=new Uint8Array(GW*GH);this.b=new Uint8Array(GW*GH);this.reset();}
  reset(){this.a.fill(0);for(let i=0;i<500;i++)this.a[Math.floor(Math.random()*GH)*GW+Math.floor(Math.random()*GW)]=1;}
  step(){const{a,b}=this;
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
        const nb=[a[ym*GW+x],a[yp*GW+x],a[y*GW+xm],a[y*GW+xp]],s=a[i];
        const nAdv=nb.filter(n=>n>=1).length,nAdv2=nb.filter(n=>n>=2).length;
        let next=s;
        if(s===0){if(nAdv>=1&&Math.random()<.06)next=1;}
        else if(s===1){if(nAdv>=3&&Math.random()<.04)next=2;else if(Math.random()<.003)next=0;}
        else if(s===2){if(nAdv2>=3&&Math.random()<.02)next=3;else if(Math.random()<.002)next=0;}
        else if(s===3){if(Math.random()<.001)next=0;}
        b[i]=next;}}
    const t=this.a;this.a=this.b;this.b=t;}
  render(){const map=[0,80,160,240];for(let i=0;i<this.a.length;i++)pixels[i]=map[this.a[i]];}
}

class GenerationalHistory{
  constructor(){this.trail=new Float32Array(GW*GH);this.tmp=new Float32Array(GW*GH);this.frame=0;this.reset();}
  reset(){this.trail.fill(0);const ag=[];
    for(let i=0;i<5000;i++)ag.push({x:Math.random()*GW,y:Math.random()*GH,d:Math.random()*Math.PI*2});
    this.agents=ag;this.frame=0;}
  _sense(x,y,dir,angle){const D=9,sx=x+Math.cos(dir+angle)*D,sy=y+Math.sin(dir+angle)*D;
    return this.trail[((Math.floor(sy)%GH+GH)%GH)*GW+((Math.floor(sx)%GW+GW)%GW)];}
  step(){const{agents,trail,tmp}=this;this.frame++;
    if(this.frame%300===0)for(let i=0;i<500;i++)agents.push({x:Math.random()*GW,y:Math.random()*GH,d:Math.random()*Math.PI*2});
    for(const a of agents){
      const fl=this._sense(a.x,a.y,a.d,-.45),fc=this._sense(a.x,a.y,a.d,0),fr=this._sense(a.x,a.y,a.d,.45);
      if(fc>=fl&&fc>=fr){}else if(fl>fr)a.d-=.40*(0.5+Math.random()*.5);else a.d+=.40*(0.5+Math.random()*.5);
      a.x=((a.x+Math.cos(a.d)*1.2)%GW+GW)%GW;a.y=((a.y+Math.sin(a.d)*1.2)%GH+GH)%GH;
      trail[Math.floor(a.y)*GW+Math.floor(a.x)]=Math.min(255,trail[Math.floor(a.y)*GW+Math.floor(a.x)]+8);}
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
        tmp[i]=(trail[i]+trail[y*GW+xm]+trail[y*GW+xp]+trail[ym*GW+x]+trail[yp*GW+x])*.2*.998;}}
    const t=this.trail;this.trail=this.tmp;this.tmp=t;}
  render(){for(let i=0;i<this.trail.length;i++)pixels[i]=Math.floor(Math.min(1,this.trail[i]/120)*255);}
}

class BriansBrain{
  constructor(){this.a=new Uint8Array(GW*GH);this.b=new Uint8Array(GW*GH);this.age=0;this.reset();}
  reset(){for(let i=0;i<this.a.length;i++)this.a[i]=Math.random()<.25?1:0;this.age=0;}
  step(){const{a,b}=this;this.age++;
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x,s=a[i];
        if(s===1){b[i]=2;}else if(s===2){b[i]=0;}
        else{let n=0;
          for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
            if(dx===0&&dy===0)continue;
            if(a[((y+dy+GH)%GH)*GW+((x+dx+GW)%GW)]===1)n++;}
          b[i]=n===2?1:0;}}}
    const t=this.a;this.a=this.b;this.b=t;
    if(this.age>600){let sum=0;for(let i=0;i<a.length;i++)if(a[i]===1)sum++;if(sum<100)this.reset();}}
  render(){for(let i=0;i<this.a.length;i++)pixels[i]=this.a[i]===1?255:this.a[i]===2?100:0;}
}

class SelectivePermeability{
  // S=small molecules: pass based on local permeability (varies continuously along membrane)
  // L=large molecules: always blocked — membrane bright where open, dark where closed
  // Permeability field built from overlapping sine waves → irregular channeling effect
  constructor(){
    this.S=new Float32Array(GW*GH);this.L=new Float32Array(GW*GH);
    this.Sn=new Float32Array(GW*GH);this.Ln=new Float32Array(GW*GH);
    this.memX=GW>>1;
    // Multi-frequency sine product → smooth but irregular permeability landscape
    this.permS=new Float32Array(GH);
    for(let y=0;y<GH;y++){
      const p=(0.5+0.5*Math.sin(y*.11))*(0.5+0.5*Math.sin(y*.07+1.3))*(0.5+0.5*Math.sin(y*.19+2.8));
      this.permS[y]=0.004+p*.36;} // range ~0.004–0.364, varies by zone
    this.frame=0;this.reset();}
  reset(){this.frame=0;const{S,L,memX}=this;
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x;
      S[i]=x<memX?0.85+Math.random()*.15:0;
      L[i]=x<memX?0.75+Math.random()*.15:0;}}
  step(){const{permS,memX}=this;this.frame++;
    if(this.frame>900)this.reset();
    const Ds=.18,Dl=.14;
    for(let sub=0;sub<3;sub++){
      const{S,L,Sn,Ln}=this;
      for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
        for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
          const cR=(x<memX&&xp>=memX)||(x>=memX&&xp<memX);
          const cL2=(x<memX&&xm>=memX)||(x>=memX&&xm<memX);
          const sp=permS[y]; // continuous local permeability for S
          const fSxp=(cR?sp:1)*(S[y*GW+xp]-S[i]);
          const fSxm=(cL2?sp:1)*(S[y*GW+xm]-S[i]);
          const fSy=(S[ym*GW+x]-S[i])+(S[yp*GW+x]-S[i]);
          const fLxp=cR?0:(L[y*GW+xp]-L[i]);
          const fLxm=cL2?0:(L[y*GW+xm]-L[i]);
          const fLy=(L[ym*GW+x]-L[i])+(L[yp*GW+x]-L[i]);
          Sn[i]=Math.max(0,Math.min(1,S[i]+Ds*(fSxp+fSxm+fSy)));
          Ln[i]=Math.max(0,Math.min(1,L[i]+Dl*(fLxp+fLxm+fLy)));}}
      let t=this.S;this.S=this.Sn;this.Sn=t;t=this.L;this.L=this.Ln;this.Ln=t;}}
  render(){const{S,L,memX,permS}=this;
    const B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x;
      if(x>=memX-1&&x<=memX+1){
        // membrane brightness encodes local permeability: bright=open channel, dark=closed
        pixels[i]=Math.floor(6+permS[y]*190);continue;}
      const thr=B[y%4][x%4]/16;
      const sOn=S[i]>thr,lOn=L[i]>thr;
      pixels[i]=sOn&&lOn?190:sOn?255:lOn?105:0;}}
}

class EquilibriumVsLiving{
  // Left: closed box, pure diffusion → gradient collapses to uniform (entropy wins)
  // Right: active pump continuously restores gradient (living system maintains order)
  // Neumann (no-flux) BCs at all walls and center divider — true closed compartments
  // Pump pulses sweep upward on right side as visual marker of active work
  constructor(){
    this.F=new Float32Array(GW*GH);this.Fn=new Float32Array(GW*GH);
    this.divX=GW>>1;this.frame=0;this.pulses=[];this.pTimer=0;this.reset();}
  reset(){const{F,divX}=this;this.frame=0;this.pulses=[];this.pTimer=0;
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)
      F[y*GW+x]=(1-y/GH)+(Math.random()-.5)*.08;}
  step(){const{F,Fn,divX}=this;this.frame++;
    if(this.frame>900)this.reset();
    const D=0.12;
    for(let sub=0;sub<4;sub++){
      for(let y=0;y<GH;y++){
        const ym=y>0?y-1:0,yp=y<GH-1?y+1:GH-1; // Neumann BC top/bottom
        for(let x=0;x<GW;x++){const i=y*GW+x;
          if(x===divX){Fn[i]=F[i];continue;} // divider: no flux across
          // Neumann BC: no-flux at outer walls and at divider
          const xm=x<divX?(x===0?0:x-1):Math.max(divX+1,x-1);
          const xp=x<divX?Math.min(divX-1,x+1):(x===GW-1?GW-1:x+1);
          const lap=F[ym*GW+x]+F[yp*GW+x]+F[y*GW+xm]+F[y*GW+xp]-4*F[i];
          const pump=x>divX?(1-y/GH-F[i])*.03:0; // active gradient restoration on right
          Fn[i]=Math.max(0,Math.min(1,F[i]+D*lap+pump));}}
      const t=this.F;this.F=this.Fn;this.Fn=t;}
    // Pump pulse — visual marker of active transport work, sweeps upward
    this.pTimer++;
    if(this.pTimer>50){this.pTimer=0;this.pulses.push({y:GH-2,speed:1.5});}
    for(const p of this.pulses)p.y-=p.speed;
    this.pulses=this.pulses.filter(p=>p.y>0);}
  render(){const{F,divX,pulses}=this;
    const B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    const pSet=new Set(pulses.map(p=>Math.floor(p.y)));
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x;
      if(x===divX){pixels[i]=60;continue;}
      if(x>divX&&pSet.has(y)){pixels[i]=210;continue;} // pulse marker
      const thr=B[y%4][x%4]/16;
      pixels[i]=F[i]>thr?255:0;}}
}

class Symbiosis{
  constructor(){this.tA=new Float32Array(GW*GH);this.tB=new Float32Array(GW*GH);
    this.tmpA=new Float32Array(GW*GH);this.tmpB=new Float32Array(GW*GH);this.reset();}
  reset(){this.tA.fill(0);this.tB.fill(0);const aA=[],aB=[];
    for(let i=0;i<3000;i++){const a=Math.random()*Math.PI*2,r=Math.random()*20;
      aA.push({x:GW*.25+Math.cos(a)*r,y:GH*.5+Math.sin(a)*r,d:0});}
    for(let i=0;i<3000;i++){const a=Math.random()*Math.PI*2,r=Math.random()*20;
      aB.push({x:GW*.75+Math.cos(a)*r,y:GH*.5+Math.sin(a)*r,d:Math.PI});}
    this.aA=aA;this.aB=aB;}
  _sense(trail,x,y,dir,angle){const D=9,sx=x+Math.cos(dir+angle)*D,sy=y+Math.sin(dir+angle)*D;
    return trail[((Math.floor(sy)%GH+GH)%GH)*GW+((Math.floor(sx)%GW+GW)%GW)];}
  _move(agents,myT,theirT){
    for(const a of agents){
      const fl=this._sense(theirT,a.x,a.y,a.d,-.40),fc=this._sense(theirT,a.x,a.y,a.d,0),fr=this._sense(theirT,a.x,a.y,a.d,.40);
      if(fc>=fl&&fc>=fr){}else if(fl>fr)a.d-=.40*(0.5+Math.random()*.5);else a.d+=.40*(0.5+Math.random()*.5);
      a.x=((a.x+Math.cos(a.d)*1.3)%GW+GW)%GW;a.y=((a.y+Math.sin(a.d)*1.3)%GH+GH)%GH;
      myT[Math.floor(a.y)*GW+Math.floor(a.x)]=Math.min(255,myT[Math.floor(a.y)*GW+Math.floor(a.x)]+7);}}
  step(){this._move(this.aA,this.tA,this.tB);this._move(this.aB,this.tB,this.tA);
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
        this.tmpA[i]=(this.tA[i]+this.tA[y*GW+xm]+this.tA[y*GW+xp]+this.tA[ym*GW+x]+this.tA[yp*GW+x])*.2*.94;
        this.tmpB[i]=(this.tB[i]+this.tB[y*GW+xm]+this.tB[y*GW+xp]+this.tB[ym*GW+x]+this.tB[yp*GW+x])*.2*.94;}}
    let t=this.tA;this.tA=this.tmpA;this.tmpA=t;t=this.tB;this.tB=this.tmpB;this.tmpB=t;}
  render(){const{tA,tB}=this;
    for(let i=0;i<tA.length;i++)pixels[i]=Math.floor(Math.min(1,Math.max(tA[i]/70,tB[i]*.6/70))*255);}
}

class MonocultureFragility{
  constructor(){this.a=new Uint8Array(GW*GH);this.b=new Uint8Array(GW*GH);this.timer=0;this.phase=0;this.reset();}
  reset(){const{a}=this;this.timer=0;this.phase=0;
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)
      a[y*GW+x]=x<GW>>1?(Math.random()<.9?1:0):Math.floor(Math.random()*5);}
  step(){const{a,b}=this;this.timer++;
    if(this.phase===0&&this.timer>350){
      for(let i=0;i<a.length;i++)if(a[i]===1)a[i]=0;this.phase=1;this.timer=0;}
    if(this.phase===1&&this.timer>400)this.reset();
    const divX=GW>>1;
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
        const N=x<divX?2:5,prey=(a[i]+1)%N;
        b[i]=(a[ym*GW+x]===prey||a[yp*GW+x]===prey||a[y*GW+xm]===prey||a[y*GW+xp]===prey)?prey:a[i];}}
    const t=this.a;this.a=this.b;this.b=t;}
  render(){const{a}=this;const divX=GW>>1;
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
      const i=y*GW+x;
      pixels[i]=x===divX?128:x<divX?Math.floor(a[i]/1*128):Math.floor(a[i]/4*255);}}
}

class ImmuneResponse{
  constructor(){this.a=new Uint8Array(GW*GH);this.b=new Uint8Array(GW*GH);this.frame=0;this.reset();}
  reset(){this.frame=0;for(let i=0;i<this.a.length;i++)this.a[i]=Math.random()<.6?1:0;
    for(let i=0;i<10;i++)this.a[Math.floor(Math.random()*GH)*GW+Math.floor(Math.random()*GW)]=2;}
  step(){const{a,b}=this;this.frame++;
    if(this.frame%200===0)for(let i=0;i<3;i++)a[Math.floor(Math.random()*GH)*GW+Math.floor(Math.random()*GW)]=2;
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
        const nb=[a[ym*GW+x],a[yp*GW+x],a[y*GW+xm],a[y*GW+xp]];
        const nH=nb.filter(n=>n===1).length,nP=nb.filter(n=>n===2).length,nI=nb.filter(n=>n===3).length;
        let s=a[i];
        if(s===0){b[i]=nH>=2&&Math.random()<.1?1:0;}
        else if(s===1){b[i]=nP>=1&&Math.random()<.15?2:nP>=1&&Math.random()<.10?3:1;}
        else if(s===2){b[i]=(nI>=1&&Math.random()<.5)||nI>=2?0:2;}
        else{b[i]=Math.random()<.02||(nP===0&&Math.random()<.01)?1:3;}}}
    const t=this.a;this.a=this.b;this.b=t;}
  render(){for(let i=0;i<this.a.length;i++)pixels[i]=[0,130,30,255][this.a[i]];}
}

class PhylogeneticBranching{
  constructor(){this.grid=new Uint8Array(GW*GH);this.walkers=[];this.reset();}
  reset(){this.grid.fill(0);this.walkers=[];
    for(let x=GW/2-5;x<GW/2+5;x++)this.grid[(GH-1)*GW+Math.floor(x)]=1;
    this.stuck=10;for(let i=0;i<500;i++)this._spawn();}
  _spawn(){this.walkers.push({x:Math.floor(Math.random()*GW),y:Math.floor(Math.random()*GH*.7)});}
  step(){const{grid,walkers}=this;
    for(let s=0;s<6;s++){
      for(let wi=walkers.length-1;wi>=0;wi--){const p=walkers[wi];
        const r=Math.random();
        if(r<.40)p.y++;else if(r<.60)p.y--;else if(r<.80)p.x++;else p.x--;
        p.x=((p.x)+GW)%GW;p.y=Math.max(0,Math.min(GH-1,p.y));
        if(grid[p.y*GW+p.x])continue;
        const below=p.y<GH-1&&grid[(p.y+1)*GW+p.x];
        const left=grid[p.y*GW+((p.x-1+GW)%GW)];
        const right=grid[p.y*GW+((p.x+1)%GW)];
        if(below||left||right){grid[p.y*GW+p.x]=1;this.stuck++;walkers.splice(wi,1);this._spawn();
          if(this.stuck>GW*GH*.25)this.reset();}}}}
  render(){for(let i=0;i<this.grid.length;i++)pixels[i]=this.grid[i]?255:0;}
}

class LangtonAnt{
  constructor(){this.grid=new Uint8Array(GW*GH);this.ants=[];this.age=0;this.reset();}
  reset(){this.grid.fill(0);this.ants=[];
    for(let i=0;i<4;i++)this.ants.push({x:GW/2+(Math.random()-.5)*20|0,y:GH/2+(Math.random()-.5)*20|0,dir:Math.floor(Math.random()*4)});
    this.age=0;}
  step(){const{grid,ants}=this;const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
    for(let s=0;s<300;s++){
      for(const ant of ants){const i=ant.y*GW+ant.x,state=grid[i];
        ant.dir=state<2?(ant.dir+3)%4:(ant.dir+1)%4;
        grid[i]=(state+1)%4;
        const d=DIRS[ant.dir];
        ant.x=((ant.x+d[0])+GW)%GW;ant.y=((ant.y+d[1])+GH)%GH;}}
    if(++this.age>3000)this.reset();}
  render(){const map=[0,85,170,255];for(let i=0;i<this.grid.length;i++)pixels[i]=map[this.grid[i]];}
}

class ContextCollapse{
  constructor(){this.a=new Uint8Array(GW*GH);this.b=new Uint8Array(GW*GH);this.radius=Math.min(GW,GH)*.45;this.cx=GW/2;this.cy=GH/2;this.age=0;this.reset();}
  reset(){for(let i=0;i<this.a.length;i++)this.a[i]=Math.random()<.3?1:0;this.radius=Math.min(GW,GH)*.45;this.age=0;}
  step(){const{a,b,cx,cy}=this;this.age++;
    if(this.age>200)this.radius=Math.max(0,this.radius-.15);
    const r=this.radius;
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
        const dist=Math.sqrt((x-cx)**2+(y-cy)**2),inside=dist<r;
        const n=a[ym*GW+xm]+a[ym*GW+x]+a[ym*GW+xp]+a[y*GW+xm]+a[y*GW+xp]+a[yp*GW+xm]+a[yp*GW+x]+a[yp*GW+xp];
        if(inside)b[i]=a[i]?(n===2||n===3?1:0):(n===3?1:0);
        else if(dist<r+20)b[i]=Math.random()<.4?Math.random()<.5?1:0:(a[i]?(n===2||n===3?1:0):(n===3?1:0));
        else b[i]=Math.random()<.5?1:0;}}
    const t=this.a;this.a=this.b;this.b=t;
    if(r<=0&&this.age>600)this.reset();}
  render(){const{a,cx,cy,radius}=this;
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
      const i=y*GW+x,dist=Math.sqrt((x-cx)**2+(y-cy)**2);
      pixels[i]=Math.abs(dist-radius)<1.5?140:(a[i]?255:0);}}
}

class TrustCrystallization{
  constructor(){this.grid=new Uint8Array(GW*GH);this.walkers=[];this.frame=0;this.stuck=0;this.reset();}
  reset(){this.grid.fill(0);this.walkers=[];this.frame=0;this.stuck=0;
    for(let i=0;i<3;i++)this.grid[Math.floor(Math.random()*GH)*GW+Math.floor(Math.random()*GW)]=25;
    for(let i=0;i<200;i++)this._spawn();}
  _spawn(){this.walkers.push({x:Math.floor(Math.random()*GW),y:Math.floor(Math.random()*GH)});}
  step(){const{grid,walkers}=this;const DIRS=[[0,1],[0,-1],[1,0],[-1,0]];this.frame++;
    if(Math.random()<.1)for(let i=0;i<grid.length;i++)if(grid[i]>0&&grid[i]<255)grid[i]=Math.min(255,grid[i]+1);
    if(this.frame%600===0){const cx=Math.floor(Math.random()*GW),cy=Math.floor(Math.random()*GH),r=10+Math.floor(Math.random()*15);
      for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
        const nx=(cx+dx+GW)%GW,ny=(cy+dy+GH)%GH;
        if(dx*dx+dy*dy<=r*r&&grid[ny*GW+nx]>0)grid[ny*GW+nx]=Math.floor(grid[ny*GW+nx]*.3);}}
    for(let wi=walkers.length-1;wi>=0;wi--){const p=walkers[wi],d=DIRS[Math.random()*4|0];
      p.x=((p.x+d[0])+GW)%GW;p.y=((p.y+d[1])+GH)%GH;
      if(grid[p.y*GW+p.x])continue;
      let adj=false;for(const[dx,dy]of DIRS){const ax=(p.x+dx+GW)%GW,ay=(p.y+dy+GH)%GH;if(grid[ay*GW+ax]){adj=true;break;}}
      if(adj){grid[p.y*GW+p.x]=20;this.stuck++;walkers.splice(wi,1);this._spawn();if(this.stuck>GW*GH*.4)this.reset();}}  }
  render(){for(let i=0;i<this.grid.length;i++)pixels[i]=this.grid[i];}
}

class Stewardship{
  constructor(){this.health=new Uint8Array(GW*GH);this.agents=[];this.frame=0;this.reset();}
  reset(){const{health}=this;this.frame=0;
    for(let i=0;i<health.length;i++)health[i]=Math.random()<.5?200+Math.floor(Math.random()*55):0;
    this.agents=[];
    for(let i=0;i<20;i++)this.agents.push({x:Math.random()*GW,y:Math.random()*GH,d:Math.random()*Math.PI*2});}
  step(){const{health,agents}=this;this.frame++;
    if(this.frame>1200)this.reset();
    // decay
    for(let i=0;i<health.length;i++)if(health[i]>0&&Math.random()<.02)health[i]=Math.max(0,health[i]-(5+Math.floor(Math.random()*25)));
    // spread
    for(let y=0;y<GH;y++){const ym=y>0?y-1:GH-1,yp=y<GH-1?y+1:0;
      for(let x=0;x<GW;x++){const xm=x>0?x-1:GW-1,xp=x<GW-1?x+1:0,i=y*GW+x;
        if(health[i]===0){const mx=Math.max(health[ym*GW+x],health[yp*GW+x],health[y*GW+xm],health[y*GW+xp]);
          if(mx>50&&Math.random()<.01)health[i]=Math.floor(mx*.6);}}}
    // tend
    for(const a of agents){a.d+=(Math.random()-.5)*.5;
      a.x=((a.x+Math.cos(a.d)*1.5)%GW+GW)%GW;a.y=((a.y+Math.sin(a.d)*1.5)%GH+GH)%GH;
      const ix=Math.floor(a.x),iy=Math.floor(a.y);
      for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
        const nx=(ix+dx+GW)%GW,ny=(iy+dy+GH)%GH;
        if(health[ny*GW+nx]<100&&Math.random()<.08)health[ny*GW+nx]=Math.min(220,health[ny*GW+nx]+30);}}}
  render(){const{health,agents}=this;
    for(let i=0;i<health.length;i++)pixels[i]=health[i];
    for(const a of agents)pixels[Math.floor(a.y)*GW+Math.floor(a.x)]=255;}
}

// ── UI + LOOP ─────────────────────────────────────────────────────
const titleEl=document.getElementById('title');
const subtitleEl=document.getElementById('subtitle');
const navEl=document.getElementById('nav');
const barEl=document.getElementById('bar');
let dots=[];
function buildDots(){
  navEl.innerHTML='';
  dots=VIZZES.map((v,i)=>{
    const d=document.createElement('div');
    d.className='dot'; d.title=v.title;
    d.addEventListener('click',()=>switchTo(i));
    navEl.appendChild(d); return d;
  });
}
const DURATION=22000;
let current=0,sim=null,startTime=0,paused=false,pauseAt=0;
function switchTo(idx){
  current=((idx%VIZZES.length)+VIZZES.length)%VIZZES.length;
  const v=VIZZES[current];
  sim=v.make(); startTime=performance.now(); pauseAt=0; paused=false;
  titleEl.textContent=v.title; subtitleEl.textContent=v.subtitle;
  dots.forEach((d,i)=>d.classList.toggle('active',i===current));
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')switchTo(current+1);
  if(e.key==='ArrowLeft')switchTo(current-1);
  if(e.key===' '){e.preventDefault();
    if(paused){startTime+=performance.now()-pauseAt;paused=false;}
    else{pauseAt=performance.now();paused=true;}}
});
function loop(ts){
  requestAnimationFrame(loop);
  if(paused)return;
  const elapsed=ts-startTime,progress=Math.min(1,elapsed/DURATION);
  barEl.style.width=(progress*100)+'%';
  if(progress>=1)switchTo(current+1);
  sim.step(); sim.render(); flush();
}
buildDots(); switchTo(0); requestAnimationFrame(loop);
</script>
