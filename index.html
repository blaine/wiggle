<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Biological Pixel Art</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #080808;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  color: #d0d0d0;
  user-select: none;
}
#canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border: 1px solid #1a1a1a;
}
#info {
  margin-top: 18px;
  text-align: center;
  width: 600px;
}
#title {
  font-size: 12px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: #e8e8e8;
  transition: opacity 0.4s;
}
#subtitle {
  font-size: 9px;
  margin-top: 5px;
  opacity: 0.35;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: opacity 0.4s;
}
#nav {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 14px;
  gap: 7px;
}
.dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #222;
  cursor: pointer;
  transition: background 0.3s;
}
.dot.active { background: #bbb; }
.dot:hover { background: #666; }
#bar-wrap {
  margin-top: 10px;
  width: 100%;
  height: 1px;
  background: #141414;
  overflow: hidden;
}
#bar {
  height: 100%;
  background: #444;
  width: 0%;
}
#key-hint {
  margin-top: 8px;
  font-size: 8px;
  letter-spacing: 2px;
  opacity: 0.15;
  text-transform: uppercase;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info">
  <div id="title"></div>
  <div id="subtitle"></div>
  <div id="nav"></div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div id="key-hint">← → to navigate &nbsp;·&nbsp; space to pause</div>
</div>

<script>
'use strict';

// ─── Canvas / Pixel Setup ─────────────────────────────────────────

const PIXEL = 3;     // screen pixels per grid cell
const GW = 200;      // grid width
const GH = 200;      // grid height

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width  = GW * PIXEL;
canvas.height = GH * PIXEL;

const imgData = ctx.createImageData(GW * PIXEL, GH * PIXEL);
const imgArr  = imgData.data;

// grayscale output buffer — each sim writes 0–255 per cell
const pixels = new Uint8Array(GW * GH);

function flush() {
  const pw = GW * PIXEL;
  for (let gy = 0; gy < GH; gy++) {
    const row = gy * PIXEL;
    for (let gx = 0; gx < GW; gx++) {
      const v = pixels[gy * GW + gx];
      const col = gx * PIXEL;
      for (let py = 0; py < PIXEL; py++) {
        for (let px = 0; px < PIXEL; px++) {
          const i = ((row + py) * pw + (col + px)) << 2;
          imgArr[i] = imgArr[i+1] = imgArr[i+2] = v;
          imgArr[i+3] = 255;
        }
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

// ─── Simulation 1: Conway's Game of Life ─────────────────────────
// Models: cell colony dynamics, population ecology

class Conway {
  constructor() {
    this.a = new Uint8Array(GW * GH);
    this.b = new Uint8Array(GW * GH);
    this.age = 0;
    this.reset();
  }

  reset() {
    for (let i = 0; i < this.a.length; i++)
      this.a[i] = Math.random() < 0.31 ? 1 : 0;
    this.age = 0;
  }

  step() {
    const { a, b } = this;
    for (let y = 0; y < GH; y++) {
      const ym = y > 0     ? y - 1 : GH - 1;
      const yp = y < GH-1  ? y + 1 : 0;
      for (let x = 0; x < GW; x++) {
        const xm = x > 0    ? x - 1 : GW - 1;
        const xp = x < GW-1 ? x + 1 : 0;
        const n =
          a[ym*GW+xm] + a[ym*GW+x] + a[ym*GW+xp] +
          a[ y*GW+xm]               + a[ y*GW+xp] +
          a[yp*GW+xm] + a[yp*GW+x] + a[yp*GW+xp];
        const alive = a[y*GW+x];
        b[y*GW+x] = alive ? (n===2||n===3 ? 1 : 0) : (n===3 ? 1 : 0);
      }
    }
    const tmp = this.a; this.a = this.b; this.b = tmp;
    if (++this.age > 700) this.reset();
  }

  render() {
    for (let i = 0; i < this.a.length; i++)
      pixels[i] = this.a[i] ? 255 : 0;
  }
}

// ─── Simulation 2: Gray-Scott Reaction-Diffusion ─────────────────
// Models: morphogenesis, pigmentation patterns, embryonic development

class GrayScott {
  constructor() {
    this.U  = new Float32Array(GW * GH);
    this.V  = new Float32Array(GW * GH);
    this.Un = new Float32Array(GW * GH);
    this.Vn = new Float32Array(GW * GH);
    this.reset();
  }

  reset() {
    // Randomise parameter set each time for variety
    const sets = [
      { F: 0.035, k: 0.065 },  // isolated spots
      { F: 0.060, k: 0.062 },  // stripes / labyrinths
      { F: 0.040, k: 0.060 },  // worm-like domains
      { F: 0.025, k: 0.060 },  // pulsing spots
    ];
    const p = sets[Math.floor(Math.random() * sets.length)];
    this.F  = p.F;   this.k  = p.k;
    this.Du = 0.210; this.Dv = 0.105;

    this.U.fill(1);
    this.V.fill(0);

    // Scatter random seeds
    const seeds = 12;
    for (let s = 0; s < seeds; s++) {
      const cx = 4 + Math.floor(Math.random() * (GW - 8));
      const cy = 4 + Math.floor(Math.random() * (GH - 8));
      const r  = 5;
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (dx*dx + dy*dy > r*r) continue;
          const x = (cx+dx+GW)%GW, y = (cy+dy+GH)%GH;
          this.U[y*GW+x] = 0.50 + (Math.random()-0.5)*0.10;
          this.V[y*GW+x] = 0.25 + (Math.random()-0.5)*0.10;
        }
      }
    }
  }

  step() {
    const { U, V, Un, Vn, F, k, Du, Dv } = this;
    const SUBSTEPS = 7;
    for (let s = 0; s < SUBSTEPS; s++) {
      for (let y = 0; y < GH; y++) {
        const ym = y > 0    ? y-1 : GH-1;
        const yp = y < GH-1 ? y+1 : 0;
        for (let x = 0; x < GW; x++) {
          const xm = x > 0    ? x-1 : GW-1;
          const xp = x < GW-1 ? x+1 : 0;
          const i  = y*GW + x;
          const u  = U[i], v = V[i];
          const lu = U[ym*GW+x] + U[yp*GW+x] + U[y*GW+xm] + U[y*GW+xp] - 4*u;
          const lv = V[ym*GW+x] + V[yp*GW+x] + V[y*GW+xm] + V[y*GW+xp] - 4*v;
          const uvv = u * v * v;
          Un[i] = u + Du*lu - uvv + F*(1 - u);
          Vn[i] = v + Dv*lv + uvv - (F + k)*v;
        }
      }
      let t = this.U; this.U = this.Un; this.Un = t;
      t = this.V; this.V = this.Vn; this.Vn = t;
    }
  }

  render() {
    const { V } = this;
    for (let i = 0; i < V.length; i++) {
      const v = Math.max(0, Math.min(1, V[i] * 5));
      pixels[i] = Math.floor((1 - v) * 255);
    }
  }
}

// ─── Simulation 3: Physarum (Slime Mold) ─────────────────────────
// Models: nutrient transport networks, cooperative foraging

class SlimeMold {
  constructor() {
    this.trail = new Float32Array(GW * GH);
    this.tmp   = new Float32Array(GW * GH);
    this.reset();
  }

  reset() {
    this.trail.fill(0);
    const N  = 7000;
    const agents = [];
    for (let i = 0; i < N; i++) {
      agents.push({
        x: Math.random() * GW,
        y: Math.random() * GH,
        d: Math.random() * Math.PI * 2
      });
    }
    this.agents = agents;
  }

  _sense(x, y, dir, angle) {
    const D  = 9;
    const sx = x + Math.cos(dir + angle) * D;
    const sy = y + Math.sin(dir + angle) * D;
    const ix = ((Math.floor(sx) % GW) + GW) % GW;
    const iy = ((Math.floor(sy) % GH) + GH) % GH;
    return this.trail[iy*GW + ix];
  }

  step() {
    const { agents, trail, tmp } = this;
    const SA      = 0.40;   // sensor angle (radians)
    const RA      = 0.40;   // rotation angle
    const SPEED   = 1.3;
    const DEPOSIT = 7;
    const DECAY   = 0.93;

    for (const a of agents) {
      const fl = this._sense(a.x, a.y, a.d, -SA);
      const fc = this._sense(a.x, a.y, a.d,  0);
      const fr = this._sense(a.x, a.y, a.d,  SA);

      if (fc >= fl && fc >= fr) {
        /* keep heading */
      } else if (fl > fr) {
        a.d -= RA * (0.5 + Math.random() * 0.5);
      } else if (fr > fl) {
        a.d += RA * (0.5 + Math.random() * 0.5);
      } else {
        a.d += (Math.random() < 0.5 ? 1 : -1) * RA;
      }

      a.x = ((a.x + Math.cos(a.d) * SPEED) % GW + GW) % GW;
      a.y = ((a.y + Math.sin(a.d) * SPEED) % GH + GH) % GH;

      const ix = Math.floor(a.x), iy = Math.floor(a.y);
      trail[iy*GW + ix] = Math.min(255, trail[iy*GW + ix] + DEPOSIT);
    }

    // Diffuse and decay
    for (let y = 0; y < GH; y++) {
      const ym = y > 0    ? y-1 : GH-1;
      const yp = y < GH-1 ? y+1 : 0;
      for (let x = 0; x < GW; x++) {
        const xm = x > 0    ? x-1 : GW-1;
        const xp = x < GW-1 ? x+1 : 0;
        const i  = y*GW + x;
        tmp[i] = (trail[i] + trail[y*GW+xm] + trail[y*GW+xp] +
                  trail[ym*GW+x] + trail[yp*GW+x]) * 0.2 * DECAY;
      }
    }
    const t = this.trail; this.trail = this.tmp; this.tmp = t;
  }

  render() {
    const { trail } = this;
    for (let i = 0; i < trail.length; i++) {
      const v = Math.min(1, trail[i] / 60);
      pixels[i] = Math.floor(v * 255);
    }
  }
}

// ─── Simulation 4: Cyclic Cellular Automaton ─────────────────────
// Models: predator-prey population cycles, ecological succession

class CyclicCA {
  constructor() {
    this.a = new Uint8Array(GW * GH);
    this.b = new Uint8Array(GW * GH);
    this.N = 5;
    this.reset();
  }

  reset() {
    for (let i = 0; i < this.a.length; i++)
      this.a[i] = Math.floor(Math.random() * this.N);
  }

  step() {
    const { a, b, N } = this;
    for (let y = 0; y < GH; y++) {
      const ym = y > 0    ? y-1 : GH-1;
      const yp = y < GH-1 ? y+1 : 0;
      for (let x = 0; x < GW; x++) {
        const xm = x > 0    ? x-1 : GW-1;
        const xp = x < GW-1 ? x+1 : 0;
        const i    = y*GW + x;
        const s    = a[i];
        const prey = (s + 1) % N;
        const eaten =
          a[ym*GW+x] === prey || a[yp*GW+x] === prey ||
          a[y*GW+xm] === prey || a[y*GW+xp] === prey;
        b[i] = eaten ? prey : s;
      }
    }
    const tmp = this.a; this.a = this.b; this.b = tmp;
  }

  render() {
    const { a, N } = this;
    for (let i = 0; i < a.length; i++)
      pixels[i] = Math.floor((a[i] / (N - 1)) * 255);
  }
}

// ─── Simulation 5: Diffusion-Limited Aggregation ─────────────────
// Models: coral skeleton growth, dendritic crystal formation, fungal branching

class DLA {
  constructor() {
    this.grid    = new Uint8Array(GW * GH);
    this.walkers = [];
    this.reset();
  }

  reset() {
    this.grid.fill(0);
    this.walkers = [];
    // Multiple seeds for faster interesting growth
    const seeds = [
      [GW>>1, GH>>1],
      [GW>>2, GH>>2],
      [GW*3>>2, GH>>2],
      [GW>>2, GH*3>>2],
      [GW*3>>2, GH*3>>2],
    ];
    for (const [x, y] of seeds)
      this.grid[y*GW + x] = 1;
    this.stuck = seeds.length;
    for (let i = 0; i < 1000; i++) this._spawn();
  }

  _spawn() {
    this.walkers.push({
      x: Math.floor(Math.random() * GW),
      y: Math.floor(Math.random() * GH)
    });
  }

  step() {
    const { grid, walkers } = this;
    const DIRS = [[0,1],[0,-1],[1,0],[-1,0]];
    const STEPS = 4; // multiple steps per frame

    for (let s = 0; s < STEPS; s++) {
      for (let wi = walkers.length - 1; wi >= 0; wi--) {
        const p = walkers[wi];
        const d = DIRS[(Math.random()*4)|0];
        p.x = ((p.x + d[0]) + GW) % GW;
        p.y = ((p.y + d[1]) + GH) % GH;

        if (grid[p.y*GW + p.x]) continue; // already occupied

        // Check adjacency
        let adj = false;
        for (const [dx, dy] of DIRS) {
          const ax = (p.x+dx+GW)%GW, ay = (p.y+dy+GH)%GH;
          if (grid[ay*GW + ax]) { adj = true; break; }
        }
        if (adj) {
          grid[p.y*GW + p.x] = 1;
          this.stuck++;
          walkers.splice(wi, 1);
          this._spawn();
          if (this.stuck > GW * GH * 0.30) this.reset();
        }
      }
    }
  }

  render() {
    for (let i = 0; i < this.grid.length; i++)
      pixels[i] = this.grid[i] ? 255 : 0;
  }
}

// ─── Simulation 6: Mitosis / Cell Division ───────────────────────
// Models: tissue growth, cell partitioning, cytokinesis

class Mitosis {
  constructor() {
    this.cells = [];
    this.reset();
  }

  reset() {
    this.cells = [];
    // Start with a handful of seed cells
    for (let i = 0; i < 4; i++) {
      this.cells.push({
        x: GW * (0.2 + Math.random() * 0.6),
        y: GH * (0.2 + Math.random() * 0.6),
        r: 4 + Math.random() * 4,
        vx: 0, vy: 0
      });
    }
    this.frame = 0;
  }

  step() {
    const { cells } = this;
    const MAX = 160;
    this.frame++;

    // Grow
    for (const c of cells) {
      c.r += 0.06;
      // Divide when large enough
      if (c.r > 16 && cells.length < MAX && Math.random() < 0.018) {
        const angle = Math.random() * Math.PI * 2;
        const off   = c.r * 0.55;
        const newR  = c.r * 0.58;
        cells.push({
          x: c.x + Math.cos(angle) * off,
          y: c.y + Math.sin(angle) * off,
          r: newR, vx: 0, vy: 0
        });
        c.x -= Math.cos(angle) * off * 0.5;
        c.y -= Math.sin(angle) * off * 0.5;
        c.r  = newR;
      }
    }

    // Repulsion between overlapping cells
    for (let i = 0; i < cells.length; i++) {
      for (let j = i + 1; j < cells.length; j++) {
        const a = cells[i], b = cells[j];
        const dx   = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 0.001;
        const min  = a.r + b.r;
        if (dist < min) {
          const push = (min - dist) / min * 0.35;
          const fx = dx / dist * push, fy = dy / dist * push;
          a.x -= fx; a.y -= fy;
          b.x += fx; b.y += fy;
        }
      }
    }

    // Soft wall boundary
    for (const c of cells) {
      c.x = Math.max(c.r, Math.min(GW - c.r, c.x));
      c.y = Math.max(c.r, Math.min(GH - c.r, c.y));
    }

    if (cells.length >= MAX && Math.random() < 0.004) this.reset();
  }

  render() {
    const { cells } = this;
    // Voronoi: find two nearest cell centres per pixel, draw boundary
    for (let y = 0; y < GH; y++) {
      for (let x = 0; x < GW; x++) {
        let d1 = 1e9, d2 = 1e9;
        for (let i = 0; i < cells.length; i++) {
          const c  = cells[i];
          const dx = x - c.x, dy = y - c.y;
          const d  = dx*dx + dy*dy;
          if (d < d1) { d2 = d1; d1 = d; }
          else if (d < d2) { d2 = d; }
        }
        const gap = Math.sqrt(d2) - Math.sqrt(d1);
        pixels[y*GW + x] = gap < 1.8 ? 0 : 215;
      }
    }
  }
}

// ─── Visualization Registry ───────────────────────────────────────

const VIZZES = [
  {
    title:    'Cell Colony',
    subtitle: "Conway's Game of Life — emergent cellular behavior & death",
    make:     () => new Conway(),
  },
  {
    title:    'Morphogenesis',
    subtitle: 'Gray-Scott reaction-diffusion — Turing pattern formation in tissue',
    make:     () => new GrayScott(),
  },
  {
    title:    'Physarum',
    subtitle: 'Slime mold agent network — cooperative nutrient transport',
    make:     () => new SlimeMold(),
  },
  {
    title:    'Predator-Prey',
    subtitle: 'Cyclic cellular automaton — competing ecological populations',
    make:     () => new CyclicCA(),
  },
  {
    title:    'Coral Growth',
    subtitle: 'Diffusion-limited aggregation — branching skeletal accretion',
    make:     () => new DLA(),
  },
  {
    title:    'Mitosis',
    subtitle: 'Voronoi cell division — tissue partitioning via cytokinesis',
    make:     () => new Mitosis(),
  },
];

// ─── UI Wiring ────────────────────────────────────────────────────

const titleEl    = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');
const navEl      = document.getElementById('nav');
const barEl      = document.getElementById('bar');

const dots = VIZZES.map((v, i) => {
  const d = document.createElement('div');
  d.className = 'dot';
  d.title     = v.title;
  d.addEventListener('click', () => switchTo(i));
  navEl.appendChild(d);
  return d;
});

// ─── Main Loop ────────────────────────────────────────────────────

const DURATION = 24000; // ms per viz
let current   = 0;
let sim       = null;
let startTime = 0;
let paused    = false;
let pauseAt   = 0;

function switchTo(idx) {
  current         = ((idx % VIZZES.length) + VIZZES.length) % VIZZES.length;
  const v         = VIZZES[current];
  sim             = v.make();
  startTime       = performance.now();
  pauseAt         = 0;
  paused          = false;
  titleEl.textContent    = v.title;
  subtitleEl.textContent = v.subtitle;
  dots.forEach((d, i) => d.classList.toggle('active', i === current));
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') switchTo(current + 1);
  if (e.key === 'ArrowLeft')  switchTo(current - 1);
  if (e.key === ' ') {
    e.preventDefault();
    if (paused) {
      startTime += performance.now() - pauseAt;
      paused = false;
    } else {
      pauseAt = performance.now();
      paused  = true;
    }
  }
});

switchTo(0);

function loop(ts) {
  requestAnimationFrame(loop);
  if (paused) return;

  const elapsed  = ts - startTime;
  const progress = Math.min(1, elapsed / DURATION);
  barEl.style.width = (progress * 100) + '%';
  if (progress >= 1) switchTo(current + 1);

  sim.step();
  sim.render();
  flush();
}

requestAnimationFrame(loop);
</script>
</body>
</html>
